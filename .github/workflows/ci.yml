name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no job needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Format
        run: ruff format --check neuroscan tests main.py
      - name: Lint
        run: ruff check neuroscan tests main.py
      - name: Types
        run: mypy
      - name: Architecture contracts
        run: lint-imports
      - name: Tests
        run: pytest
      - name: Static security analysis
        run: bandit -q -r neuroscan main.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, lint, format, duplicates, tests, build
        run: npm run check
      - name: Dependency audit
        run: npm audit --audit-level=moderate

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history for secrets (gitleaks, checksum-verified)
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
