version: 2
updates:
  - package-ecosystem: pip
    directory: /Backend
    schedule:
      interval: weekly
    # Wait a week after a release so malicious or broken versions are caught first.
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
    # Wait a week after a release so malicious or broken versions are caught first.
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8 supports TypeScript <6.1; a TypeScript 7 bump makes `npm ci` fail.
      # Remove once typescript-eslint declares TypeScript 7 support.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release so malicious or broken versions are caught first.
    cooldown:
      default-days: 7
