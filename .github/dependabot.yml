version: 2
updates:
  - package-ecosystem: pip
    directory: /Backend
    schedule:
      interval: weekly
    # Wait a week after a release so malicious or broken versions are caught first.
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
    # Wait a week after a release so malicious or broken versions are caught first.
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release so malicious or broken versions are caught first.
    cooldown:
      default-days: 7
